
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muslim Cilik Pixel Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="game">

  <button id="soundToggle" class="sound-toggle">
    🔊 SUARA ON
  </button>

  <!-- HOME -->
  <section id="home" class="screen home">
    <div class="sun">☀️</div>
    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>

    <div class="home-content">
      <div class="mascot">🧕🏻</div>

      <h1>PETUALANGAN<br>
        <span>MUSLIM CILIK</span>
      </h1>

      <p class="subtitle">
        🌙 Belajar Islam sambil bermain! ⭐
      </p>

      <div class="name-box">
        <label for="playerName">Siapa nama kamu? 😊</label>

        <input id="playerName"
          type="text"
          maxlength="15"
          placeholder="Tulis namamu...">

        <button id="startBtn" class="main-btn">
          MULAI PETUALANGAN 🚀
        </button>
      </div>
    </div>

    <div class="ground">🌷 🌳 🕌 🌼 🌴 🌷</div>
  </section>

  <!-- MENU -->
  <section id="menu" class="screen menu hidden">

    <div class="topbar">
      <span>🌟 MUSLIM CILIK</span>
      <span id="score">⭐ 0</span>
    </div>

    <h2>Assalamu'alaikum! 👋</h2>
    <h1 id="welcomeName">Halo, teman!</h1>

    <p class="big-text">
      Yuk pilih petualanganmu!
    </p>

    <div class="guide">🧒🏻</div>

    <div class="level-grid">

      <button class="level-card" data-category="salam">
        <span>👋</span>
        <b>Salam & Doa</b>
        <small>Belajar mengucap salam</small>
      </button>

      <button class="level-card" data-category="islam">
        <span>🕌</span>
        <b>Agama Islam</b>
        <small>Kenali agama kita</small>
      </button>

      <button class="level-card" data-category="ibadah">
        <span>🤲</span>
        <b>Ibadah</b>
        <small>Belajar salat dan wudu</small>
      </button>

      <button class="level-card" data-category="akhlak">
        <span>💖</span>
        <b>Akhlak Baik</b>
        <small>Menjadi anak baik</small>
      </button>

    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen quiz hidden">

    <div class="topbar">
      <button id="backBtn" class="small-btn">
        ⬅ MENU
      </button>

      <span id="questionNumber">1/3</span>
      <span id="quizScore">⭐ 0</span>
    </div>

    <div class="quiz-character">🧒🏻</div>

    <div class="question-card">
      <div id="questionIcon" class="question-icon">🌙</div>

      <h2 id="questionText">
        Apa ucapan saat bertemu teman?
      </h2>

      <p>Yuk pilih jawaban yang benar! 💕</p>
    </div>

    <div id="answers" class="answers"></div>

    <div id="feedback" class="feedback"></div>

    <button id="nextBtn" class="main-btn hidden">
      LANJUT ➜
    </button>

  </section>

  <!-- FINISH -->
  <section id="finish" class="screen finish hidden">

    <div class="confetti">🎉 ⭐ 🌈 🎊</div>

    <div class="trophy">🏆</div>

    <h1>MASYAALLAH!</h1>
    <h2>Kamu Hebat Sekali! 💖</h2>

    <p id="finalMessage"></p>

    <div id="finalStars" class="final-stars"></div>

    <button id="againBtn" class="main-btn">
      MAIN LAGI 🔄
    </button>

    <button id="homeBtn" class="secondary-btn">
      KEMBALI KE MENU 🏡
    </button>

  </section>

</main>

<script src="script.js"></script>
</body>
</html>
